name: Publish to the Official MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --help | head -3

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Authenticate with OIDC (no device code needed)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish
